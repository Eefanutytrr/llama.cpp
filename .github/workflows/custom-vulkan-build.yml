
name: Build llama.cpp v1.0.0 Vulkan x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Vulkan Build
    runs-on: windows-2025

    env:
      VULKAN_VERSION: 1.4.357.0
      LLAMA_COMMIT: b1b770d90d94cad9e9ea5b993bdbc383a522fb28

    steps:
      - name: Checkout exact v1.0.0 commit
        uses: actions/checkout@v4
        with:
          ref: b1b770d90d94cad9e9ea5b993bdbc383a522fb28

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"

          curl.exe -L `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe" `
            -o $installer

          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK download failed"
          }

          & $installer --accept-licenses --default-answer --confirm-command install

          if ($LASTEXITCODE -ne 0) {
            throw "Vulkan SDK installation failed"
          }

          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "C:\VulkanSDK\$env:VULKAN_VERSION\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja --yes --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Ninja installation failed"
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" `
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DGGML_RPC=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_VULKAN=ON `
            -DLLAMA_BUILD_BORINGSSL=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Verify and Package
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "build\bin\Release"

          if (!(Test-Path "$bin\llama-server.exe")) {
            throw "llama-server.exe was not generated"
          }

          $vulkan = Get-ChildItem $bin -Filter "ggml-vulkan.dll" -Recurse

          if (!$vulkan) {
            throw "ggml-vulkan.dll was not generated"
          }

          $package = Join-Path $PWD "llama-v1.0.0-vulkan-x64"

          New-Item -ItemType Directory -Path $package -Force | Out-Null

          Copy-Item "$bin\*" $package -Recurse -Force
          Copy-Item "LICENSE" $package -Force

          @"
          Version: v1.0.0
          Commit: $env:LLAMA_COMMIT
          Architecture: Windows x64
          Backend: Vulkan
          "@ | Set-Content "$package\BUILD-INFO.txt"

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "llama-v1.0.0-vulkan-x64.zip" `
            -Force

          Write-Host "=== PACKAGE CONTENTS ==="
          Get-ChildItem $package -Recurse

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-v1.0.0-vulkan-x64
          path: llama-v1.0.0-vulkan-x64.zip
          if-no-files-found: error
          retention-days: 14
